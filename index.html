<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ea">
  <title>Recipe Vault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">Personal Recipe Vault</p>
      <h1>Recipe Vault</h1>
      <p>ChatGPT Plusで整えた保存用JSONを、写真と一緒に保存・検索・改善できます。</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="section-head">
        <div>
          <h2>レシピ登録</h2>
          <p>料理名や材料はJSONから取得します。手入力は最小限です。</p>
        </div>
        <button id="copyPromptBtn" type="button">GPT用プロンプトをコピー</button>
      </div>

      <label for="recipeJson">アプリ保存用JSON</label>
      <textarea id="recipeJson" rows="13" spellcheck="false" placeholder='{"schema_version":1,"title":"..."}'></textarea>

      <div class="button-row">
        <button id="pasteBtn" type="button">クリップボードから貼り付け</button>
        <button id="previewBtn" type="button">JSONプレビュー</button>
      </div>

      <label for="photo">写真</label>
      <input id="photo" type="file" accept="image/*">
      <p class="hint">写真はGoogle Driveへ保存されます。大きい画像は通信に時間がかかります。</p>

      <div id="validationPanel" class="message hidden"></div>
      <div id="preview" class="preview hidden"></div>

      <button id="saveBtn" class="primary" type="button">保存する</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="section-head">
        <div>
          <h2>レシピ一覧</h2>
          <p>料理名・食材・タグ・気分タグで検索できます。</p>
        </div>
        <button id="reloadBtn" type="button">再読み込み</button>
      </div>

      <label for="searchInput">検索</label>
      <input id="searchInput" type="search" placeholder="例: 鶏肉 さっぱり 作り置き">
      <div id="recipeList" class="recipe-list"></div>
    </section>

    <section id="detailCard" class="card hidden">
      <div class="section-head">
        <div>
          <h2 id="detailTitle">レシピ詳細</h2>
          <p id="detailMeta"></p>
        </div>
        <button id="closeDetailBtn" type="button">閉じる</button>
      </div>

      <div id="detailBody" class="detail-body"></div>

      <div class="button-row">
        <button id="copyRecipeBtn" type="button">GPT相談用にコピー</button>
        <button id="copyPromptFromDetailBtn" type="button">GPT用プロンプトをコピー</button>
      </div>

      <h3>バージョン履歴</h3>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
